<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniMax API 管理平台</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    :root {
      --primary: #6C5CE7;
      --primary-light: #A29BFE;
      --primary-dark: #5B4BD5;
      --bg: #0F0F1A;
      --bg-card: #1A1A2E;
      --bg-card-hover: #22223A;
      --border: #2D2D4A;
      --text: #E0E0FF;
      --text-dim: #8888AA;
      --green: #00D9A5;
      --red: #FF6B6B;
      --yellow: #FDCB6E;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(108,92,231,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(162,155,254,0.06) 0%, transparent 50%);
      z-index: -1;
      animation: bgFloat 20s ease-in-out infinite;
    }
    @keyframes bgFloat {
      0%,100% { transform: translate(0,0); }
      50% { transform: translate(-2%,-2%); }
    }
    
    /* Navbar */
    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; height: 64px;
      background: rgba(26,26,46,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .navbar-brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: white;
    }
    .brand-name { font-size: 18px; font-weight: 600; }
    .nav-links { display: flex; gap: 8px; }
    .nav-tab {
      padding: 8px 16px; border-radius: 8px; border: none;
      background: transparent; color: var(--text-dim); font-size: 14px;
      font-weight: 500; cursor: pointer; transition: all 0.2s;
    }
    .nav-tab:hover { background: var(--bg-card-hover); color: var(--text); }
    .nav-tab.active { background: var(--primary); color: white; }
    .status-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 20px;
      background: rgba(0,217,165,0.1); border: 1px solid rgba(0,217,165,0.3);
      font-size: 12px; color: var(--green);
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green); animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .btn {
      padding: 8px 16px; border-radius: 8px; border: none;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white; box-shadow: 0 4px 12px rgba(108,92,231,0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(108,92,231,0.4); }
    .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg-card-hover); color: var(--text); }
    .btn-danger { background: rgba(255,107,107,0.1); color: var(--red); border: 1px solid rgba(255,107,107,0.3); }
    .btn-danger:hover { background: rgba(255,107,107,0.2); }
    .btn-sm { padding: 4px 8px; font-size: 12px; }
    
    /* Container */
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    
    /* Stats Grid */
    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px;
    }
    .stat-label { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .stat-sub { font-size: 12px; color: var(--text-dim); }
    
    /* Card */
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; margin-bottom: 24px;
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
    }
    .card-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; }
    .card-title-icon { font-size: 20px; }
    .card-body { padding: 20px; }
    
    /* Table */
    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td {
      padding: 12px 16px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .table th { font-size: 12px; color: var(--text-dim); font-weight: 500; }
    .table tr:hover { background: var(--bg-card-hover); }
    
    /* Badge */
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 500;
    }
    .badge-active { background: rgba(0,217,165,0.1); color: var(--green); }
    .badge-inactive { background: rgba(255,107,107,0.1); color: var(--red); }
    
    /* Progress Bar */
    .progress-bar {
      height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 8px;
    }
    .progress-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
    .progress-green { background: var(--green); }
    .progress-yellow { background: var(--yellow); }
    .progress-red { background: var(--red); }
    
    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 20px; padding: 24px; width: 90%; max-width: 480px;
      transform: translateY(20px); transition: transform 0.2s;
    }
    .modal-overlay.show .modal { transform: translateY(0); }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-title { font-size: 18px; font-weight: 600; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 8px; border: none;
      background: var(--bg-card-hover); color: var(--text-dim); font-size: 20px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: rgba(255,107,107,0.1); color: var(--red); border-color: var(--red); }
    
    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-dim); margin-bottom: 8px; }
    .form-input {
      width: 100%; padding: 12px 16px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 14px; transition: all 0.2s;
    }
    .form-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(108,92,231,0.15); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    
    /* Key Display */
    .key-display {
      margin-top: 16px; padding: 16px; border-radius: 12px;
      background: rgba(0,217,165,0.05); border: 1px solid rgba(0,217,165,0.2);
    }
    .key-label { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
    .key-value {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px; border-radius: 8px; background: var(--bg);
      font-family: monospace; font-size: 13px; word-break: break-all;
    }
    
    /* Toast */
    .toast-container {
      position: fixed; bottom: 24px; right: 24px; z-index: 2000;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast {
      padding: 12px 20px; border-radius: 12px; font-size: 14px;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .toast-success { background: rgba(0,217,165,0.15); border: 1px solid rgba(0,217,165,0.3); color: var(--green); }
    .toast-error { background: rgba(255,107,107,0.15); border: 1px solid rgba(255,107,107,0.3); color: var(--red); }
    
    /* Login Modal */
    .login-modal {
      position: fixed; inset: 0; background: var(--bg);
      z-index: 9999; display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 24px; padding: 40px; width: 100%; max-width: 400px; text-align: center;
    }
    .login-logo {
      width: 64px; height: 64px; margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 18px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; color: white;
      box-shadow: 0 8px 32px rgba(108,92,231,0.35);
    }
    .login-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .login-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 32px; }
    .login-error {
      color: var(--red); font-size: 13px; margin-bottom: 16px;
      padding: 12px; background: rgba(255,107,107,0.1); border-radius: 8px;
      border: 1px solid rgba(255,107,107,0.2);
    }
    .login-btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white; font-size: 15px; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 20px rgba(108,92,231,0.3);
    }
    .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(108,92,231,0.4); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Docs Page */
    .docs-page { max-width: 800px; }
    .docs-page h2 { font-size: 20px; margin: 24px 0 12px; color: var(--text); }
    .docs-page p { color: var(--text-dim); line-height: 1.7; margin-bottom: 12px; }
    .docs-page code {
      background: var(--bg); padding: 2px 8px; border-radius: 4px;
      font-family: monospace; font-size: 13px; color: var(--primary-light);
    }
    .docs-page pre {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; overflow-x: auto; margin-bottom: 16px;
    }
    .docs-page pre code { background: none; padding: 0; }

    /* Models Grid */
    .models-grid { display: grid; gap: 12px; }
    .model-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; border-radius: 12px;
      background: rgba(108,92,231,0.06); border: 1px solid rgba(108,92,231,0.15);
    }
    .model-id { font-weight: 600; min-width: 200px; }
    .model-desc { color: var(--text-dim); font-size: 13px; }

    /* Responsive */
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .navbar { padding: 0 16px; }
      .nav-links { display: none; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Login Modal -->
    <div v-if="showLogin" class="login-modal">
      <div class="login-box">
        <div class="login-logo">M</div>
        <h1 class="login-title">MiniMax API 管理平台</h1>
        <p class="login-sub">请输入账号信息登录</p>
        <div v-if="loginError" class="login-error">{{ loginError }}</div>
        <div class="form-group">
          <input type="text" v-model="loginForm.username" placeholder="用户名" class="form-input" @keyup.enter="doLogin">
        </div>
        <div class="form-group">
          <input type="password" v-model="loginForm.password" placeholder="密码" class="form-input" @keyup.enter="doLogin">
        </div>
        <button class="login-btn" @click="doLogin" :disabled="loginLoading">
          {{ loginLoading ? '登录中...' : '登录' }}
        </button>
      </div>
    </div>

    <!-- Main App -->
    <template v-else>
      <!-- Navbar -->
      <nav class="navbar">
        <div class="navbar-brand">
          <div class="logo">M</div>
          <span class="brand-name">MiniMax API</span>
        </div>
        <div class="nav-links">
          <button class="nav-tab" :class="{active: tab==='keys'}" @click="tab='keys'">API Keys</button>
          <button class="nav-tab" :class="{active: tab==='master'}" @click="tab='master'">主KEY配置</button>
          <button class="nav-tab" :class="{active: tab==='docs'}" @click="tab='docs'">使用文档</button>
          <button class="nav-tab" :class="{active: tab==='query'}" @click="tab='query'">用量查询</button>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="status-badge">
            <div class="status-dot"></div>
            <span>{{ masterConfigured ? 'API已连接' : '未配置API' }}</span>
          </div>
          <button class="btn btn-ghost btn-sm" @click="doLogout">退出</button>
        </div>
      </nav>

      <div class="container">
        <!-- Keys Page -->
        <div v-if="tab==='keys'">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">总 KEY 数量</div>
              <div class="stat-value">{{ keys.length }}</div>
              <div class="stat-sub">活跃 {{ activeKeys }} 个</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">今日总调用</div>
              <div class="stat-value">{{ todayTotal }}</div>
              <div class="stat-sub">本月 {{ monthTotal }} 次</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">本月总调用</div>
              <div class="stat-value">{{ monthTotal }}</div>
              <div class="stat-sub">累计 {{ totalUsage }} 次</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">活跃 KEY</div>
              <div class="stat-value">{{ activeKeys }}</div>
              <div class="stat-sub">/ {{ keys.length }} 总数</div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title"><span class="card-title-icon">🔑</span> API Key 管理</div>
              <button class="btn btn-primary" @click="openGenerateModal">+ 生成新 KEY</button>
            </div>
            <table class="table">
              <thead>
                <tr>
                  <th>API Key</th>
                  <th>用户</th>
                  <th>状态</th>
                  <th>今日/每日</th>
                  <th>本月/每月</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="k in keys" :key="k.api_key">
                  <td><code>{{ k.api_key }}</code></td>
                  <td>{{ k.user_name || '-' }}</td>
                  <td><span class="badge" :class="k.is_active ? 'badge-active' : 'badge-inactive'">{{ k.is_active ? '启用' : '禁用' }}</span></td>
                  <td>
                    <div>{{ k.used_today }} / {{ k.daily_limit }}</div>
                    <div class="progress-bar">
                      <div class="progress-fill" :class="getProgressClass(k.used_today, k.daily_limit)" :style="{width: Math.min(100, k.used_today/k.daily_limit*100)+'%'}"></div>
                    </div>
                  </td>
                  <td>
                    <div>{{ k.used_monthly }} / {{ k.monthly_limit }}</div>
                    <div class="progress-bar">
                      <div class="progress-fill" :class="getProgressClass(k.used_monthly, k.monthly_limit)" :style="{width: Math.min(100, k.used_monthly/k.monthly_limit*100)+'%'}"></div>
                    </div>
                  </td>
                  <td>
                    <button class="btn btn-ghost btn-sm" @click="toggleKey(k)" title="启用/禁用">{{ k.is_active ? '禁用' : '启用' }}</button>
                    <button class="btn btn-ghost btn-sm" @click="resetKey(k)" title="重置用量">重置</button>
                    <button class="btn btn-danger btn-sm" @click="deleteKey(k)">删除</button>
                  </td>
                </tr>
                <tr v-if="keys.length === 0">
                  <td colspan="6" style="text-align:center;color:var(--text-dim);padding:40px;">暂无 API Key，点击上方按钮生成</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Master Key Page -->
        <div v-if="tab==='master'" class="card">
          <div class="card-header">
            <div class="card-title"><span class="card-title-icon">⚙️</span> 主 KEY 配置</div>
          </div>
          <div class="card-body">
            <p style="color:var(--text-dim);margin-bottom:20px;">配置你的 MiniMax 主 API Key，所有用户请求都会使用这个 Key 进行代理。</p>
            <div class="form-group">
              <label class="form-label">MiniMax API Key</label>
              <input type="text" v-model="masterKeyInput" placeholder="输入你的 MiniMax API Key" class="form-input">
            </div>
            <button class="btn btn-primary" @click="saveMasterKey" :disabled="saving">
              {{ saving ? '保存中...' : '保存配置' }}
            </button>
          </div>
        </div>

        <!-- Docs Page -->
        <!-- Docs Page -->
        <div v-if="tab==='docs'" class="docs-page">
          <div class="card">
            <div class="card-header">
              <div class="card-title"><span class="card-title-icon">📖</span> 使用文档</div>
            </div>
            <div class="card-body">
              
              <div class="docs-section">
                <h2>🚀 快速开始</h2>
                <p>使用 MiniMax API 只需三步：</p>
                <div class="step-list">
                  <div class="step-item"><span class="step-num">1</span> 在下方生成一个 API Key</div>
                  <div class="step-item"><span class="step-num">2</span> 配置你的主 KEY（管理员）</div>
                  <div class="step-item"><span class="step-num">3</span> 开始调用 API</div>
                </div>
              </div>

              <div class="docs-section">
                <h2>🌐 API 接入地址</h2>
                <pre><code>POST https://tools.imoons.cn/mini/v1/chat/completions</code></pre>
                <p class="docs-tip">注意：所有请求都需要通过 HTTPS 发送</p>
              </div>

              <div class="docs-section">
                <h2>🔐 认证方式</h2>
                <p>在请求头中添加您的 API Key：</p>
                <pre><code>X-Api-Key: your-api-key</code></pre>
                <p class="docs-example">完整请求示例：</p>
                <pre><code>curl -X POST https://tools.imoons.cn/mini/v1/chat/completions \
  -H "Content-Type: application/json" \
  -H "X-Api-Key: mmx-xxxxxxxxxxxxxxxx"</code></pre>
              </div>

              <div class="docs-section">
                <h2>📤 请求格式</h2>
                <pre><code>{
  "model": "MiniMax-M2.7",
  "messages": [
    {"role": "system", "content": "你是一个有用的助手"},
    {"role": "user", "content": "你好，请介绍一下你自己"}
  ],
  "temperature": 0.7,
  "max_tokens": 1000
}</code></pre>
                
                <div class="param-table">
                  <div class="param-row param-header">
                    <div class="param-name">参数</div>
                    <div class="param-type">类型</div>
                    <div class="param-required"></div>
                    <div class="param-desc">说明</div>
                  </div>
                  <div class="param-row">
                    <div class="param-name">model</div>
                    <div class="param-type">string</div>
                    <div class="param-required">✅</div>
                    <div class="param-desc">模型名称，见下方模型列表</div>
                  </div>
                  <div class="param-row">
                    <div class="param-name">messages</div>
                    <div class="param-type">array</div>
                    <div class="param-required">✅</div>
                    <div class="param-desc">对话消息列表</div>
                  </div>
                  <div class="param-row">
                    <div class="param-name">temperature</div>
                    <div class="param-type">float</div>
                    <div class="param-required"></div>
                    <div class="param-desc">采样温度 0-2，越高越有创造性</div>
                  </div>
                  <div class="param-row">
                    <div class="param-name">max_tokens</div>
                    <div class="param-type">int</div>
                    <div class="param-required"></div>
                    <div class="param-desc">最大生成 token 数</div>
                  </div>
                </div>
              </div>

              <div class="docs-section">
                <h2>📥 响应格式</h2>
                <pre><code>{
  "id": "chatcmpl-xxxxx",
  "object": "chat.completion",
  "created": 1711545600,
  "model": "MiniMax-M2.7",
  "choices": [{
    "index": 0,
    "message": {
      "role": "assistant",
      "content": "你好！我是..."
    },
    "finish_reason": "stop"
  }],
  "usage": {
    "prompt_tokens": 20,
    "completion_tokens": 50,
    "total_tokens": 70
  }
}</code></pre>
              </div>

              <div class="docs-section">
                <h2>💻 代码示例</h2>
                
                <h3>cURL</h3>
                <pre><code>curl -X POST https://tools.imoons.cn/mini/v1/chat/completions \
  -H "Content-Type: application/json" \
  -H "X-Api-Key: mmx-xxxxxxxxxxxxxxxx" \
  -d '{
    "model": "MiniMax-M2.7",
    "messages": [{"role": "user", "content": "你好"}]
  }'</code></pre>

                <h3>Python</h3>
                <pre><code>import requests

              <div class="docs-section">
                <h2>⚠️ 错误码</h2>
                <div class="error-list">
                  <div class="error-item">
                    <span class="error-code">401</span>
                    <span class="error-msg">API Key 无效或已禁用</span>
                  </div>
                  <div class="error-item">
                    <span class="error-code">429</span>
                    <span class="error-msg">请求过于频繁，已达限额</span>
                  </div>
                  <div class="error-item">
                    <span class="error-code">500</span>
                    <span class="error-msg">服务器内部错误</span>
                  </div>
                  <div class="error-item">
                    <span class="error-code">502</span>
                    <span class="error-msg">上游 API 服务异常</span>
                  </div>
                </div>
              </div>

              <div class="docs-section">
                <h2>⏱️ 限流说明</h2>
                <p>每个 API Key 都有独立的调用限额：</p>
                <ul class="docs-list">
                  <li><strong>每日限制</strong>：每天最多调用次数，可在生成 Key 时设置</li>
                  <li><strong>每月限制</strong>：每月最多调用次数，可在生成 Key 时设置</li>
                  <li><strong>实时限流</strong>：短时间内大量请求会被临时拦截</li>
                </ul>
                <p>请在控制台查看您的使用量和限额，或访问 <a href="/query" class="docs-link">用量查询</a> 页面。</p>
              </div>

              <div class="docs-section">
                <h2>🤖 支持的模型</h2>
                <div class="models-grid">
                  <div v-for="m in models" :key="m.id" class="model-item">
                    <span class="model-id">{{ m.id }}</span>
                    <span class="model-desc">{{ m.desc }}</span>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>


        <!-- Query Page -->
        <div v-if="tab==='query'" class="card" style="max-width:600px;">
          <div class="card-header">
            <div class="card-title"><span class="card-title-icon">📊</span> 用量查询</div>
          </div>
          <div class="card-body">
            <div class="form-group">
              <label class="form-label">输入你的 API Key</label>
              <div style="display:flex;gap:12px;">
                <input type="text" v-model="queryKey" placeholder="mmx-xxxxxxxx" class="form-input" @keyup.enter="doQuery">
                <button class="btn btn-primary" @click="doQuery" :disabled="querying">{{ querying ? '查询中...' : '查询' }}</button>
              </div>
            </div>

            <div v-if="queryError" style="color:var(--red);margin-top:12px;padding:12px;background:rgba(255,107,107,.1);border-radius:8px;">{{ queryError }}</div>

            <div v-if="queryResult" style="margin-top:24px;">
              <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
                <div class="stat-card">
                  <div class="stat-label">今日用量</div>
                  <div class="stat-value">{{ queryResult.used_today.toLocaleString() }}</div>
                  <div class="stat-sub">限额 {{ queryResult.daily_limit.toLocaleString() }}</div>
                  <div class="progress-bar">
                    <div class="progress-fill" :class="getProgressClass(queryResult.used_today, queryResult.daily_limit)" :style="{width: Math.min(100, queryResult.used_today/queryResult.daily_limit*100)+'%'}"></div>
                  </div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">本月用量</div>
                  <div class="stat-value">{{ queryResult.used_monthly.toLocaleString() }}</div>
                  <div class="stat-sub">限额 {{ queryResult.monthly_limit.toLocaleString() }}</div>
                  <div class="progress-bar">
                    <div class="progress-fill" :class="getProgressClass(queryResult.used_monthly, queryResult.monthly_limit)" :style="{width: Math.min(100, queryResult.used_monthly/queryResult.monthly_limit*100)+'%'}"></div>
                  </div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">累计用量</div>
                  <div class="stat-value">{{ queryResult.total_used.toLocaleString() }}</div>
                  <div class="stat-sub">{{ queryResult.is_active ? '✅ 启用' : '❌ 禁用' }}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Generate Modal -->
    <div class="modal-overlay" :class="{show: showGenerateModal}" @click.self="showGenerateModal=false">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">生成新 API Key</div>
          <button class="modal-close" @click="showGenerateModal=false">×</button>
        </div>
        <div class="form-group">
          <label class="form-label">用户名称（可选）</label>
          <input type="text" v-model="newKeyForm.user_name" placeholder="例如：张三" class="form-input">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">每日限制（次）</label>
            <input type="number" v-model.number="newKeyForm.daily_limit" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">每月限制（次）</label>
            <input type="number" v-model.number="newKeyForm.monthly_limit" class="form-input">
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px;" @click="generateKey" :disabled="generating">
          {{ generating ? '生成中...' : '🔑 生成 KEY' }}
        </button>
        <div v-if="generatedKey" class="key-display">
          <div class="key-label">新生成的 API Key</div>
          <div class="key-value">
            <span style="font-size:12px;word-break:break-all;">{{ generatedKey }}</span>
            <button class="btn btn-sm btn-ghost" @click="copyKey(generatedKey)">复制</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast-container">
      <div v-for="t in toasts" :key="t.id" class="toast" :class="'toast-'+t.type">
        {{ t.type === 'success' ? '✅' : '❌' }} {{ t.msg }}
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;
    const API_BASE = '/mini';

    createApp({
      setup() {
        const tab = ref('keys');
        const keys = ref([]);
        const masterConfigured = ref(false);
        const showLogin = ref(true);
        const loginForm = ref({ username: 'admin', password: '' });
        const loginLoading = ref(false);
        const loginError = ref('');
        const loggingOut = ref(false);
        const showGenerateModal = ref(false);
        const masterKeyInput = ref('');
        const saving = ref(false);
        const generating = ref(false);
        const generatedKey = ref('');
        const toasts = ref([]);
        const queryKey = ref('');
        const queryResult = ref(null);
        const queryError = ref('');
        const querying = ref(false);

        const newKeyForm = ref({ user_name: '', daily_limit: 1000, monthly_limit: 30000 });
        
        const models = [
          { id: 'MiniMax-M2.7', desc: '旗舰模型（编程/Agent/办公，SOTA）' },
          { id: 'MiniMax-M2.7-highspeed', desc: 'M2.7 极速版（效果不变，100 TPS）' },
          { id: 'MiniMax-M2.5', desc: '顶尖性能与极致性价比' },
          { id: 'MiniMax-M2.5-highspeed', desc: 'M2.5 极速版（100 TPS）' },
          { id: 'MiniMax-M2.1', desc: '强大多语言编程能力' },
          { id: 'MiniMax-M2.1-highspeed', desc: 'M2.1 极速版（100 TPS）' },
          { id: 'MiniMax-M2', desc: '高效编码与 Agent 工作流' },
        ];

        const activeKeys = computed(() => keys.value.filter(k => k.is_active).length);
        const todayTotal = computed(() => keys.value.reduce((s,k) => s + k.used_today, 0));
        const monthTotal = computed(() => keys.value.reduce((s,k) => s + k.used_monthly, 0));
        const totalUsage = computed(() => keys.value.reduce((s,k) => s + k.total_used, 0));

        function showToast(msg, type='success') {
          const id = Date.now();
          toasts.value.push({ id, msg, type });
          setTimeout(() => { toasts.value = toasts.value.filter(t => t.id !== id); }, 3000);
        }

        function getProgressClass(used, limit) {
          const r = used / limit;
          return r > 0.9 ? 'progress-red' : r > 0.6 ? 'progress-yellow' : 'progress-green';
        }

        async function loadKeys() {
          try {
            const r = await axios.get(API_BASE + '/api/admin/keys');
            keys.value = r.data.data || [];
          } catch(e) { showToast('加载失败', 'error'); }
        }

        async function loadMasterStatus() {
          try {
            const r = await axios.get(API_BASE + '/api/admin/masterkey');
            masterConfigured.value = r.data.data.configured;
            masterKeyInput.value = r.data.data.api_key || '';
          } catch(e) { masterConfigured.value = false; }
        }

        function openGenerateModal() {
          generatedKey.value = '';
          newKeyForm.value = { user_name: '', daily_limit: 1000, monthly_limit: 30000 };
          showGenerateModal.value = true;
        }

        async function generateKey() {
          generating.value = true;
          try {
            const r = await axios.post(API_BASE + '/api/admin/key_generate', newKeyForm.value);
            generatedKey.value = r.data.data.api_key;
            showToast('Key 生成成功');
            loadKeys();
          } catch(e) { showToast(e.response?.data?.error || '生成失败', 'error'); }
          finally { generating.value = false; }
        }

        async function saveMasterKey() {
          saving.value = true;
          try {
            await axios.post(API_BASE + '/api/admin/masterkey', { api_key: masterKeyInput.value });
            showToast('配置已保存');
            loadMasterStatus();
          } catch(e) { showToast(e.response?.data?.error || '保存失败', 'error'); }
          finally { saving.value = false; }
        }

        async function toggleKey(k) {
          try {
            await axios.put(API_BASE + '/api/admin/key_toggle?api_key=' + encodeURIComponent(k.api_key));
            showToast(k.is_active ? '已禁用' : '已启用');
            loadKeys();
          } catch(e) { showToast('操作失败', 'error'); }
        }

        async function resetKey(k) {
          try {
            await axios.put(API_BASE + '/api/admin/key_reset?api_key=' + encodeURIComponent(k.api_key));
            showToast('用量已重置');
            loadKeys();
          } catch(e) { showToast('重置失败', 'error'); }
        }

        async function deleteKey(k) {
          if (!confirm('确定要删除这个 API Key 吗？')) return;
          try {
            await axios.delete(API_BASE + '/api/admin/key_delete?api_key=' + encodeURIComponent(k.api_key));
            showToast('已删除');
            loadKeys();
          } catch(e) { showToast('删除失败', 'error'); }
        }

        function copyKey(key) {
          navigator.clipboard.writeText(key);
          showToast('已复制到剪贴板');
        }

        async function doQuery() {
          if (!queryKey.value) { queryError.value = '请输入 API Key'; queryResult.value = null; return; }
          querying.value = true;
          queryError.value = '';
          try {
            const r = await axios.get(API_BASE + '/api/query/usage?api_key=' + encodeURIComponent(queryKey.value));
            if (r.data.success) {
              queryResult.value = r.data.data;
              queryError.value = '';
            } else {
              queryError.value = r.data.error || '查询失败';
              queryResult.value = null;
            }
          } catch(e) {
            queryError.value = e.response?.data?.error || 'API Key 不存在或查询失败';
            queryResult.value = null;
          } finally { querying.value = false; }
        }

        onMounted(async () => {
          try {
            const r = await axios.get(API_BASE + '/api/check');
            if (!r.data.authenticated) {
              showLogin.value = true;
              return;
            }
            showLogin.value = false;
            loadKeys();
            loadMasterStatus();
          } catch(e) {
            showLogin.value = true;
          }
        });

        async function doLogin() {
          if (!loginForm.value.username || !loginForm.value.password) {
            loginError.value = '请输入用户名和密码';
            return;
          }
          loginLoading.value = true;
          loginError.value = '';
          try {
            const r = await axios.post(API_BASE + '/api/login', loginForm.value);
            showLogin.value = false;
            loginForm.value.password = '';
            loadKeys();
            loadMasterStatus();
          } catch(e) {
            loginError.value = e.response?.data?.error || '登录失败，请检查账号密码';
          } finally {
            loginLoading.value = false;
          }
        }

        async function doLogout() {
          try { await axios.post(API_BASE + '/api/logout'); } catch(e) {}
          showLogin.value = true;
          keys.value = [];
          loginForm.value = { username: 'admin', password: '' };
        }

        return {
          tab, keys, masterConfigured, showGenerateModal, masterKeyInput,
          saving, generating, generatedKey, toasts,
          queryKey, queryResult, queryError, querying,
          newKeyForm, models,
          activeKeys, todayTotal, monthTotal, totalUsage,
          getProgressClass, openGenerateModal, generateKey,
          saveMasterKey, toggleKey, resetKey, deleteKey, copyKey, doQuery,
          showLogin, loginForm, loginLoading, loginError, doLogin, doLogout
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
